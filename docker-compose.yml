services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: evacway2
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init/evacway2-pg16.sql:/docker-entrypoint-initdb.d/evacway2.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d evacway2"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/evacway2
      DB_HOST: db
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      APP_URL_PUBLIC: ${APP_URL_PUBLIC-}
      APP_URL_LOCAL: ${APP_URL_LOCAL-http://localhost:8080}
    volumes:
      - uploads:/app/static/uploads
      - ./frontend/public/sogod_boundary.geojson:/app/data/sogod_boundary.geojson:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MAPBOX_TOKEN: ${MAPBOX_TOKEN}
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  cloudflared:
    profiles:
      - cloudflare
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_started

volumes:
  pgdata:
  uploads:
